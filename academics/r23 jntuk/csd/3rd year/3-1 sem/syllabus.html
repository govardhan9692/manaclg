<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../../../../assests/imp q page/Logo-favicon.png" type="image/png">
    <title>CSD 3-1 Semester Syllabus</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow-x: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
        }

        .name {
            padding: 10px;
            border-radius: 20px;
            background-color: white;
            margin-bottom: 30px;
            color: rgb(95, 95, 95);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .notes {
            padding: 15px;
            margin-bottom: 30px;
            width: 80vw;
            height: 80vh;
            border-radius: 8px;
            background-color: rgb(243, 243, 243);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 8px;
        }

        @media only screen and (max-width: 600px) {
            .notes {
                width: 95vw;
                height: 70vh;
            }

            .name {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="name">
            <h2>CSD 3-1 Semester Syllabus</h2>
        </div>
        <div class="notes">
            <iframe src="https://drive.google.com/file/d/1qTxC_lAN-wK8eGqt1UhnDqgGaXLlGP40/preview"
                frameborder="0"></iframe>
        </div>
    </div>
</body>

</html>
