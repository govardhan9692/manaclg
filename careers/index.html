<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to ManaClg Careers</title>
    <meta http-equiv="refresh" content="0;URL='https://manaclglevelupcareers.vercel.app'" />
    <link rel="canonical" href="https://manaclglevelupcareers.vercel.app" />
    <!-- Same favicon as main site for continuity -->
    <link rel="icon" type="image/png" sizes="32x32" 
          href="https://res.cloudinary.com/dkg4ghjsh/image/upload/v1747307151/icon_t1wjrl.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #3498db;
            --secondary-color: #2980b9;
            --accent-color: #f39c12;
            --text-color: #333;
            --bg-color: #f5f5f5;
            --card-bg: white;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: var(--text-color);
        }

        .redirect-container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        .redirect-message {
            position: relative;
            margin: 0 auto;
            padding: 40px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border-top: 5px solid var(--primary-color);
            transition: all 0.3s ease;
        }

        .redirect-message:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        h1 {
            margin-top: 0;
            color: var(--primary-color);
            font-weight: 700;
            font-size: 28px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 2px;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        p {
            margin: 20px 0;
            color: #555;
            font-size: 16px;
            line-height: 1.6;
        }

        a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        a:hover {
            color: var(--secondary-color);
            text-decoration: underline;
        }

        /* Advanced loader animation */
        .loader-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100px;
        }

        .loader {
            position: relative;
            width: 80px;
            height: 80px;
        }

        .loader div {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--primary-color);
            animation: loader 1.2s linear infinite;
        }

        .loader div:nth-child(1) {
            top: 8px;
            left: 8px;
            animation-delay: 0s;
        }

        .loader div:nth-child(2) {
            top: 8px;
            left: 32px;
            animation-delay: -0.4s;
        }

        .loader div:nth-child(3) {
            top: 8px;
            left: 56px;
            animation-delay: -0.8s;
        }

        .loader div:nth-child(4) {
            top: 32px;
            left: 8px;
            animation-delay: -0.4s;
        }

        .loader div:nth-child(5) {
            top: 32px;
            left: 32px;
            animation-delay: -0.8s;
        }

        .loader div:nth-child(6) {
            top: 32px;
            left: 56px;
            animation-delay: -1.2s;
        }

        .loader div:nth-child(7) {
            top: 56px;
            left: 8px;
            animation-delay: -0.8s;
        }

        .loader div:nth-child(8) {
            top: 56px;
            left: 32px;
            animation-delay: -1.2s;
        }

        .loader div:nth-child(9) {
            top: 56px;
            left: 56px;
            animation-delay: -1.6s;
        }

        @keyframes loader {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.7);
            }
        }

        /* Responsive design */
        @media (max-width: 600px) {
            .redirect-container {
                padding: 15px;
            }
            .redirect-message {
                padding: 25px;
            }
            h1 {
                font-size: 22px;
            }
            .logo {
                font-size: 26px;
            }
        }

        .progress-bar {
            height: 4px;
            background: #ddd;
            width: 100%;
            margin-top: 30px;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, var(--primary-color), var(--accent-color));
            animation: progress 2s ease-in-out forwards;
        }

        @keyframes progress {
            0% { width: 0; }
            100% { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="redirect-message">
            <div class="logo">MANACLG</div>
            <h1>Redirecting to ManaClg Careers</h1>
            
            <div class="loader-container">
                <div class="loader">
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                    <div></div>
                </div>
            </div>
            
            <p>You're being redirected to our careers platform. Please wait...</p>
            
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            
            <p>If you are not redirected automatically, <a href="https://manaclglevelupcareers.vercel.app">click here</a>.</p>
        </div>
    </div>

    <script>
        // Enhanced JavaScript redirect with timeout
        setTimeout(function() {
            window.location.href = "https://manaclglevelupcareers.vercel.app";
        }, 2000); // 2 second delay to show animation
    </script>
</body>
</html>
