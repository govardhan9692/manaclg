<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Team</title>
    <link rel="stylesheet" href="styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <header class="header">
        <a href="#" class="logo">About Us<span class="animate" style="--i:1;"></span></a>
        <a href=""></a>
    </header>

    <section class="about show-animate" id="about">
        <div class="hero-image">
            <!-- Add your hero image here -->
            <img src="./images/dt.jpeg" alt="Hero Image">
        </div>
        <h2 class="heading">OUR <span>DREAM TEAM</span><span class="animate scroll" style="--i:1;"></span></h2>
        <div id="team"></div>
    </section>

    <footer class="footer">
        <div class="footer-text">
            <p>Copyright &copy; 2024 Designed by Dream Team | All rights Reserved</p>
            <span class="animate scroll" style="--i:1;"></span>
        </div>
        <div class="footer-iconTop">
            <a href="#"><i class='bx bx-up-arrow-alt'></i></a>
            <span class="animate scroll" style="--i:3;"></span>
        </div>
    </footer>

    <audio id="background-music" autoplay>
        <source src="./assests/rolex.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
