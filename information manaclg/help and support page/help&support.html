<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Manaclg</title>
  <link rel="stylesheet" href="./style.css">

</head>
<body>
  <main>
    <section class="contact-form">
      <h2>Help & Support</h2>
      <div class="contact-actions">
        <a href="https://wa.me/9849834102?text=Hello%20Sir%20My%20Name%20is." class="whatsapp" target="_blank">Chat with us on WhatsApp</a>
        <a href="tel:9849834102" class="call-now">Call Now</a>
      </div>
      <form id="contactForm" name="submit-to-google-sheet">
        <div>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required placeholder="Enter your name">
        </div>
        <div>
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required placeholder="Enter your email">
        </div>
        <div>
          <label for="message">Message:</label>
          <textarea id="message" name="message" required placeholder="Enter your message in detail"></textarea>
        </div>
        <button type="submit">Send Message</button>
      </form>
     
    </section>
  </main>
  <script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbw3vcs14S20SGz48mkyImvwIqU3DS9ONdP84qfHwZC9UJ5GvdHBIa-vXx_nJ_-1PIRRvw/exec';
    const form = document.forms['submit-to-google-sheet'];

    form.addEventListener('submit', e => {
      e.preventDefault();
      fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => {
          console.log('Success!', response);
          alert("Your request is submitted");
          form.reset(); // Reset the form after successful submission
        })
        .catch(error => console.error('Error!', error.message));
    });
  </script>
</body>
</html>
